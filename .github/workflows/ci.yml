name: CI

on:
  push:
    branches:
      - main
      - chore/mobile-test-baseline
      - feat/50-levels
      - feat/puzzle-rework
      - feat/toy-warehouse-3d
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run CI checks
        run: pnpm run ci

      - name: Build static release
        run: pnpm build:pages

      - name: Install test browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser regression tests
        run: pnpm test:e2e
